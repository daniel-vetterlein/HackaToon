<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha | HACKTOON</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/formulario.css">
  <link rel="stylesheet" href="/css/paginas/cadastro.css">
</head>
<body>
  <div class="site-page">
    <div id="menu"></div>

    <main class="cadastro-main">
      <section class="cadastro-hero">
        <div class="hero-topo">
          <a class="voltar" href="/login">← Voltar ao login</a>
          <span class="eyebrow">RECUPERAR ACESSO</span>
        </div>
        <h1>ESQUECEU A <em>SENHA?</em></h1>
        <p>Use o código de recuperação que você recebeu ao criar a conta para definir uma nova senha.</p>
      </section>

      <section class="cadastro-card">
        <div class="cadastro-topo"><span>REDEFINIR SENHA</span></div>

        <form id="form-recuperar" novalidate>
          <h2 class="login-titulo">NOVA SENHA</h2>

          <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required maxlength="160" placeholder="nome@exemplo.com">
          </div>
          <div class="campo">
            <label for="codigo">Código de recuperação</label>
            <input id="codigo" name="codigo" type="text" autocomplete="off" required maxlength="40" placeholder="ABCD-EFGH-JKLM-NPQR" class="mono">
          </div>
          <div class="campo">
            <label for="senha">Nova senha</label>
            <input id="senha" name="senha" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="Mínimo de 8 caracteres">
          </div>
          <div class="campo">
            <label for="confirmar_senha">Confirmar nova senha</label>
            <input id="confirmar_senha" name="confirmar_senha" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="Repita a senha">
          </div>

          <p class="form-erro" role="alert"></p>
          <div class="acoes">
            <button class="btn btn-primary comic-button" type="submit">Redefinir senha</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="/js/menu.js" defer></script>
  <script src="/js/senha.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/recuperar-senha.js" defer></script>
</body>
</html>
