<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área do organizador | HACKTOON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/formulario.css">
  <link rel="stylesheet" href="/css/paginas/organizador.css">
</head>
<body>
  <div class="site-page">
    <div id="menu"></div>
    <main class="area-main">
      <h1 class="area-titulo">MEUS <em>EVENTOS</em></h1>

      <div class="grade-2">
        <section class="cartao">
          <h2>Criar evento</h2>
          <form id="form-criar" novalidate>
            <div class="campo"><label for="nome">Nome do evento</label>
              <input id="nome" type="text" required maxlength="120"></div>
            <div class="campo"><label for="descricao">Descrição (opcional)</label>
              <textarea id="descricao" maxlength="1000" rows="3"></textarea></div>
            <p class="form-erro" role="alert"></p>
            <button class="btn btn-primary comic-button" type="submit">Criar evento</button>
          </form>
        </section>

        <section class="cartao">
          <h2>Entrar em um evento</h2>
          <p class="sub">Use o <strong>código de jurados/organizadores</strong> que o criador do evento compartilhou.</p>
          <form id="form-entrar" novalidate>
            <div class="campo"><label for="codigo">Código</label>
              <input id="codigo" type="text" required maxlength="20" autocomplete="off" class="mono"></div>
            <p class="form-erro" role="alert"></p>
            <button class="btn btn-jurado comic-button" type="submit">Entrar no evento</button>
          </form>
        </section>
      </div>

      <section class="cartao">
        <h2>Seus eventos</h2>
        <ul id="lista" class="lista"></ul>
      </section>
    </main>
  </div>
  <script src="/js/menu.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/organizador.js" defer></script>
</body>
</html>
